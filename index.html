function weekKeyClient(day){const x=new Date(day+'T12:00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return x.toISOString().slice(0,10)}
function cleanStatus(t,day,records){const period=t.frequency==='weekly'?weekKeyClient(day):day;return records.find(x=>x.task_id===t.id&&x.period===period)}
function makeAlerts({stock,prepared,closing,manual,notes,day}){
 const a=[];
 stock.filter(x=>x.status==='out').forEach(x=>a.push({level:'urgent',title:x.name+' — OUT',detail:'Morning Stock needs purchasing attention'}));
 stock.filter(x=>x.status==='low').forEach(x=>a.push({level:'caution',title:x.name+' — LOW',detail:'Add to shopping needs'}));
 if(stock.filter(x=>!x.status).length)a.push({level:'caution',title:stock.filter(x=>!x.status).length+' unchecked morning products',detail:'Morning stock check is not complete'});
 if(prepared.filter(x=>!x.prepared_at&&eligible(x)).length)a.push({level:'caution',title:prepared.filter(x=>!x.prepared_at&&eligible(x)).length+' prep tasks outstanding',detail:'Still awaiting completion'});
 if(closing.length<prepared.length)a.push({level:'info',title:(prepared.length-closing.length)+' missing closing counts',detail:'Complete at closing; blank does not mean zero'});
 if(notes.some(x=>!x.my_read_at))a.push({level:'info',title:notes.filter(x=>!x.my_read_at).length+' unread shift notes',detail:'Read and acknowledge manager notes'});
 return a;
}

function persistDraft(){const out={};c.querySelectorAll('[data-closing-qty]').forEach(inp=>{out[inp.dataset.closingQty]=inp.value});try{localStorage.setItem(draftKey,JSON.stringify(out))}catch(e){}let n=Object.values(out).filter(v=>v!=='').length;c.querySelector('#closing-progress').textContent=n+' of '+prepared.length+' filled in';c.querySelector('#closing-save-note').textContent='Draft saved on this device. Use Save Closing Count to submit.'}
c.querySelectorAll('[data-closing-qty]').forEach(inp=>inp.addEventListener('input',persistDraft));
async function submitClosing(){const inputs=[...c.querySelectorAll('[data-closing-qty]')];let payload=[];for(const inp of inputs){if(inp.value.trim()==='')continue;if(!inp.checkValidity()||!Number.isFinite(Number(inp.value))||Number(inp.value)<0){inp.focus();status('Please correct the quantity before saving.',true);return}payload.push({id:Number(inp.dataset.closingQty),qty:Number(inp.value)})}if(!payload.length){status('Enter at least one closing quantity to save.',true);return}try{status('Saving all closing counts…');await api('closing-batch',{counts:payload});localStorage.removeItem(draftKey);await load();status('Saved '+payload.length+' closing count(s). Blank items were not changed.')}catch(e){status(e.message,true)}}
c.querySelector('#save-all-closing').onclick=submitClosing;c.querySelector('#save-all-closing-bottom').onclick=submitClosing;
c.querySelector('#view-tomorrow').onclick=()=>{persistDraft();tab='Prep List';prepDayView='tomorrow';render()}
}
if(tab==='Cleaning'){
 const entries=(state.cleaning_tasks||[]).filter(x=>x.active),records=state.cleaning||[],doneCount=entries.filter(x=>cleanStatus(x,day,records)).length;
 c.innerHTML=`<h2>Cleaning Checklist</h2><p class="help">Daily tasks reset each day. Weekly tasks reset every Monday. Employee completions are tracked and can be reopened if checked by mistake.</p><section class="panel"><div class="section-title"><b>${doneCount} / ${entries.length} tasks complete</b><span class="chip">${Math.round(100*doneCount/Math.max(1,entries.length))}%</span></div><div class="progress-track" style="margin-top:12px"><div class="progress-bar" style="width:${100*doneCount/Math.max(1,entries.length)}%"></div></div></section>${['daily','weekly'].map(freq=>`<h3>${freq==='daily'?'Daily':'Weekly'} cleaning</h3>${entries.filter(x=>x.frequency===freq).map(x=>{let record=cleanStatus(x,day,records);return `<article class="manage-row"><div class="grow"><b>${esc(x.name)}</b><p class="muted" style="margin:4px 0">${record?'Completed by '+esc(record.by)+' at '+clock(record.at):'Not completed yet'}</p></div><button class="${record?'ghost':''}" data-clean-id="${x.id}" data-clean-action="${record?'cleaning-reopen':'cleaning-done'}">${record?'↺ Reopen':'✓ Complete'}</button></article>`}).join('')}`).join('')}${user.role==='manager'?`<section class="panel"><h3>Add cleaning task</h3><form id="clean-create"><label>Task description<input name="name" required maxlength="120" placeholder="e.g. Sanitize blender bases"></label><label>Frequency<select name="frequency"><option value="daily">Daily</option><option value="weekly">Weekly</option></select></label><button>Add task</button></form><details style="margin-top:16px"><summary>Manage cleaning tasks</summary><p class="muted">Edit task names and daily/weekly schedule below. Past completion records remain saved.</p>${(state.cleaning_tasks||[]).map(x=>`<div class="manage-row line"><form class="grow" data-clean-edit="${x.id}" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,150px);gap:8px;align-items:end"><label>Task name<input name="name" maxlength="120" value="${esc(x.name)}" required></label><label>Schedule<select name="frequency"><option value="daily" ${x.frequency==='daily'?'selected':''}>Daily</option><option value="weekly" ${x.frequency==='weekly'?'selected':''}>Weekly</option></select></label><div class="row" style="grid-column:1/-1;gap:8px"><button type="submit">Save changes</button><button type="button" class="ghost" data-clean-toggle="${x.id}">${x.active?'Deactivate':'Restore'}</button><span class="tag">${x.active?'Active':'Inactive'}</span></div></form></div>`).join('')}</details></section>`:''}`;
 c.querySelectorAll('[data-clean-id]').forEach(b=>b.onclick=()=>save(b.dataset.cleanAction,{id:+b.dataset.cleanId}));
 const form=c.querySelector('#clean-create');if(form)form.onsubmit=e=>{e.preventDefault();save('cleaning-manage',{action:'add',name:form.elements.name.value,frequency:form.elements.frequency.value})};
 c.querySelectorAll('[data-clean-toggle]').forEach(b=>b.onclick=()=>save('cleaning-manage',{action:'toggle',id:+b.dataset.cleanToggle}));c.querySelectorAll('[data-clean-edit]').forEach(f=>f.onsubmit=e=>{e.preventDefault();save('cleaning-manage',{action:'edit',id:+f.dataset.cleanEdit,name:f.elements.name.value,frequency:f.elements.frequency.value})});
}
if(tab==='Alerts'){
 const alerts=makeAlerts({stock,prepared,closing,manual,notes,day});c.innerHTML=`<h2>Priority Alerts</h2><p class="help">These alerts are generated from your current counts and tasks. They disappear as the underlying issue is resolved.</p><div class="alert-grid">${alerts.map(x=>`<article class="alert-card ${x.level}"><b>${esc(x.title)}</b><p>${esc(x.detail)}</p></article>`).join('')||'<section class="panel"><p class="ok">Nothing currently needs attention.</p></section>'}</div>`;
}
if(tab==='Inventory History'){
 const hist=state.closing_history||[],mh=state.stock_history||[],items=prepared;
 c.innerHTML=`<h2>Inventory History</h2><p class="help">Review previous closing counts and morning checks. In this offline demo, click <b>Simulate next day</b> to archive today's saved counts.</p><section class="panel"><label for="history-item">Prepared ingredient<select id="history-item">${items.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><div id="history-detail"></div></section><section class="panel"><h3>Morning Stock history</h3><div class="history-scroll"><table class="history-table"><thead><tr><th>Date</th><th>Product</th><th>Status</th><th>Optional quantity</th></tr></thead><tbody>${mh.slice().reverse().slice(0,80).map(x=>`<tr><td>${esc(x.day)}</td><td>${esc(x.name)}</td><td>${esc(x.status.toUpperCase())}</td><td>${x.qty??'—'}</td></tr>`).join('')||'<tr><td colspan="4">No historical stock checks yet.</td></tr>'}</tbody></table></div></section>`;
 const select=c.querySelector('#history-item'),detail=c.querySelector('#history-detail');function showHistory(){const id=+select.value;let rows=hist.filter(x=>x.item_id===id).slice().reverse(),p=items.find(x=>x.id===id);detail.innerHTML=`<h3>${esc(p?.name||'')}</h3><div class="history-scroll"><table class="history-table"><thead><tr><th>Date</th><th>Closing quantity</th><th>Target</th><th>Below target?</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.day)}</td><td>${fmt(x.qty)} ${esc(x.unit)}</td><td>${fmt(x.target)} ${esc(x.unit)}</td><td>${x.qty<x.target?'Yes':'No'}</td></tr>`).join('')||'<tr><td colspan="4">No saved previous-day counts yet.</td></tr>'}</tbody></table></div>`}select.onchange=showHistory;showHistory();
}

if(tab==='Note to Management'){
 const mine=(state.employee_notes||[]).filter(n=>n.created_by===user.id);
 c.innerHTML=`<h2>Note to Management</h2><p class="muted">Tell your manager something important. No need to choose a recipient—management will see it.</p><section class="panel"><form id="employee-note-form"><label>Message<textarea name="body" rows="4" maxlength="1200" placeholder="What should management know?" required></textarea></label><label>Priority<select name="priority"><option value="normal">Normal</option><option value="important">Important</option></select></label><button type="submit">Send note to management</button></form></section><h3>My recent notes</h3>${mine.length?mine.slice(0,12).map(n=>`<article><div class="section-title"><strong>${n.priority==='important'?'⚠ Important':'Normal'} · ${esc(n.day)}</strong><span class="tag ${n.status==='new'?'warn':''}">${esc(n.status)}</span></div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.body)}</p><p class="muted">Sent ${clock(n.created_at)}${n.acknowledged_name?' · Acknowledged by '+esc(n.acknowledged_name):''}${n.resolved_name?' · Resolved by '+esc(n.resolved_name):''}</p></article>`).join(''):'<p class="muted">No notes submitted yet.</p>'}`;
 const nf=c.querySelector('#employee-note-form');nf.onsubmit=e=>{e.preventDefault();save('employee-note-create',{body:nf.elements.body.value,priority:nf.elements.priority.value})};
}
if(tab==='Team Notes'&&isManager){
 const notes=state.employee_notes||[],open=notes.filter(n=>n.status!=='resolved');
 c.innerHTML=`<h2>Team Notes</h2><p class="muted">Messages from the kitchen. Acknowledge when seen, and mark resolved when handled.</p><section class="panel"><b>${open.filter(n=>n.status==='new').length} new · ${open.filter(n=>n.status==='acknowledged').length} acknowledged · ${notes.filter(n=>n.status==='resolved').length} resolved</b></section>${notes.length?notes.map(n=>`<article><div class="section-title"><strong>${esc(n.author_name)} · ${esc(n.day)}</strong><span class="tag ${n.priority==='important'?'bad':n.status==='new'?'warn':''}">${n.priority==='important'?'Important · ':''}${esc(n.status)}</span></div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.body)}</p><p class="muted">Sent ${clock(n.created_at)}${n.acknowledged_name?' · Acknowledged by '+esc(n.acknowledged_name):''}${n.resolved_name?' · Resolved by '+esc(n.resolved_name):''}</p><div class="row">${n.status==='new'?`<button data-note-status="${n.id}:acknowledged">Acknowledge</button>`:''}${n.status!=='resolved'?`<button class="ghost" data-note-status="${n.id}:resolved">Mark resolved</button>`:''}</div></article>`).join(''):'<section class="panel"><p class="muted">No employee notes yet.</p></section>'}`;
 c.querySelectorAll('[data-note-status]').forEach(b=>b.onclick=()=>{let [id,status]=b.dataset.noteStatus.split(':');save('employee-note-status',{id:Number(id),status})});
}

if(tab==='Daily Notes'){
const notes=state.notes||[],staff=state.staff||[],unread=notes.filter(n=>!n.my_read_at);
c.innerHTML=`<h2>Daily Notes</h2><p class="help">Shift information for ${esc(day)}. Managers can post a note for everyone or one employee. Staff can acknowledge a note after reading it.</p>${user.role==='manager'?`<section class="panel"><h3>Post a note</h3><form id="note-create"><label>Message<textarea name="body" rows="4" maxlength="1200" placeholder="Shift reminders, deliveries, special prep requests…" required></textarea></label><label>Who should see it?<select name="recipient_id"><option value="all">Everyone</option>${staff.filter(x=>x.id!==undefined).map(x=>`<option value="${x.id}">${esc(x.name)} (${esc(x.role)})</option>`).join('')}</select></label><button type="submit">Post today's note</button></form></section>`:''}<section class="panel"><strong>${notes.length} notes · ${unread.length} unread for you</strong></section>${notes.length?notes.map(n=>`<article><div class="section-title"><strong>${esc(n.recipient_name?'To: '+n.recipient_name:'For everyone')}</strong><span class="tag ${n.my_read_at?'':'warn'}">${n.my_read_at?'Read':'Unread'}</span></div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.body)}</p><p class="muted">Posted by ${esc(n.author_name)} · ${clock(n.created_at)}${user.role==='manager'?' · '+n.read_count+' acknowledgment(s)':''}</p>${!n.my_read_at?`<button type="button" data-note-read="${n.id}">Mark as read</button>`:''}</article>`).join(''):'<section class="panel"><p class="muted">No notes have been posted for today.</p></section>'}`;
const nf=c.querySelector('#note-create');if(nf)nf.onsubmit=e=>{e.preventDefault();save('note-create',{body:nf.elements.body.value,recipient_id:nf.elements.recipient_id.value})};
c.querySelectorAll('[data-note-read]').forEach(b=>b.onclick=()=>save('note-read',{id:+b.dataset.noteRead}));
}
if(tab==='Activity'){c.innerHTML=`<h2>Today's activity log</h2>${audit.length?audit.map(x=>`<article><b>${esc(x.action)}</b><p class="muted">${esc(x.name)} · ${clock(x.at)} · ${esc(x.detail)}</p></article>`).join(''):'<section class="panel">No activity yet today.</section>'}`}
if(tab==='Setup'){
const inactiveMorning=state.inactive_stock||[],inactiveClosing=state.inactive_prepared||[];
const editor=(x,section)=>`<article><form class="edit-item" data-section="${section}" data-id="${x.id}"><div class="section-title"><strong>${esc(x.name)}</strong><span class="tag">${section==='morning'?'Morning stock':'Closing + auto prep'}</span></div><div class="two"><label>Name<input name="name" value="${esc(x.name)}" maxlength="120" required></label><label>Unit<input name="unit" value="${esc(x.unit)}" maxlength="24" required></label>${section==='morning'?`<label>Category<input name="category" value="${esc(x.category)}" maxlength="60" required></label>`:`<label>Target par<input name="par" type="number" min="0" step="any" value="${x.par??''}" required></label>`}</div><div class="row" style="margin-top:12px"><button>Save changes</button><button type="button" class="ghost" data-disable="${section}:${x.id}">Deactivate</button></div></form></article>`;
c.innerHTML=`<h2>Manage items</h2><p class="help">Only managers can change the item lists. Add a product to Morning Stock, Closing Count, or both. Closing items automatically appear in tomorrow’s prep list whenever a closing count is below its target. Deactivating hides an item from new checklists without deleting its past records.</p><section class="panel"><h3>Add an item</h3><form id="add-managed"><label>Item name<input name="name" placeholder="e.g. Chorizo" maxlength="120" required></label><div class="two"><label><input type="checkbox" name="inMorning" checked style="width:auto"> Morning Stock (Good / Low / Out)</label><label><input type="checkbox" name="inClosing" style="width:auto"> Closing Count + automatic prep</label></div><div id="morning-fields"><label>Morning category<input name="category" value="Other" maxlength="60"></label><label>Morning unit<input name="morning_unit" value="item" maxlength="24"></label></div><div id="closing-fields" hidden><label>Closing unit<select name="closing_unit"><option value="qt">Quarts</option><option value="1/6 pans">1/6 pans</option><option value="bottles">Bottles</option><option value="lb">Pounds</option><option value="item">Items</option></select></label><label>Closing target par<input name="par" type="number" min="0" step="any" placeholder="Set target"></label></div><button>Add item to selected lists</button></form></section><h3>Morning Stock — ${stock.length} active items</h3>${stock.map(x=>editor(x,'morning')).join('')}<h3>Closing Count — ${prepared.length} active items</h3>${prepared.map(x=>editor(x,'closing')).join('')}<section class="panel"><h3>Inactive items</h3>${[...inactiveMorning.map(x=>({...x,section:'morning'})),...inactiveClosing.map(x=>({...x,section:'closing'}))].length?[...inactiveMorning.map(x=>({...x,section:'morning'})),...inactiveClosing.map(x=>({...x,section:'closing'}))].map(x=>`<div class="row line"><span class="grow">${esc(x.name)} · ${x.section==='morning'?'Morning':'Closing'}</span><button class="ghost" data-enable="${x.section}:${x.id}">Restore</button></div>`).join(''):'<p class="muted">No deactivated items.</p>'}</section><section class="panel"><h3>Create employee account</h3><form id="staff"><label>Full name<input name="name" required></label><label>Username<input name="username" required></label><label>Initial password (12+ characters)<input name="password" minlength="12" type="password" autocomplete="new-password" required></label><label>Role<select name="role"><option value="employee">Employee</option><option value="manager">Manager</option></select></label><button>Create account</button></form></section>`;
const af=c.querySelector('#add-managed'),mf=c.querySelector('#morning-fields'),cf=c.querySelector('#closing-fields');function toggle(){mf.hidden=!af.elements.inMorning.checked;cf.hidden=!af.elements.inClosing.checked;}af.elements.inMorning.onchange=toggle;af.elements.inClosing.onchange=toggle;toggle();
af.onsubmit=async e=>{e.preventDefault();const morn=af.elements.inMorning.checked,close=af.elements.inClosing.checked;if(!morn&&!close){status('Select at least one list.',true);return}if(close&&(af.elements.par.value===''||Number(af.elements.par.value)<0)){status('Enter a closing target.',true);return}const name=af.elements.name.value;try{if(morn)await api('manage-item',{action:'create',section:'morning',name,unit:af.elements.morning_unit.value,category:af.elements.category.value});if(close)await api('manage-item',{action:'create',section:'closing',name,unit:af.elements.closing_unit.value,par:af.elements.par.valueAsNumber});await load();status('Item added.')}catch(err){await load();status(err.message,true)}};
c.querySelectorAll('.edit-item').forEach(f=>f.onsubmit=e=>{e.preventDefault();let d={action:'update',section:f.dataset.section,id:+f.dataset.id,name:f.elements.name.value,unit:f.elements.unit.value};if(f.dataset.section==='morning')d.category=f.elements.category.value;else d.par=f.elements.par.valueAsNumber;save('manage-item',d)});
c.querySelectorAll('[data-disable]').forEach(b=>b.onclick=()=>{const [section,id]=b.dataset.disable.split(':');if(confirm('Deactivate this item? Past counts will be kept.'))save('manage-item',{action:'deactivate',section,id:+id})});
c.querySelectorAll('[data-enable]').forEach(b=>b.onclick=()=>{const [section,id]=b.dataset.enable.split(':');save('manage-item',{action:'reactivate',section,id:+id})});let staff=c.querySelector('#staff');staff.onsubmit=e=>{e.preventDefault();save('user',Object.fromEntries(new FormData(staff)))};
}


if(!tabs.includes(tab)){
 const back=document.createElement('button');back.type='button';back.className='ghost';back.style.margin='14px 0';back.textContent='← '+(isManager?'Daily work':'Home');back.onclick=()=>{tab=isManager?'Daily Work':'Home';render()};c.prepend(back);
}
}
window.addEventListener('onpar-preview-role-changed',async e=>{tab='Home';prepDayView='today';status('');await load();status(e.detail.role==='employee'?'Employee demo ready. Select any of the four daily tasks below.':'Manager demo ready. Open the management tools below.');});logout.onclick=async()=>{status('Use the Test Employee View or Test Manager View controls above to switch demo roles.');};load();

</script></body></html>
